[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbench-cli"
version = "0.1.0"
description = "A Linux-friendly iperf3 benchmark controller for throughput, UDP loss, jitter, and estimated payload PPS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NetBench contributors" }]
keywords = ["networking", "benchmark", "iperf3", "packet-loss", "throughput"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
netbench = "netbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
